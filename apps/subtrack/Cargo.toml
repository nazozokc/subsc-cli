[package]
name = "subtrack-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "subtrack_core"
path = "native/src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
openssl = { version = "0.10", features = ["vendored"] }
scrypt = "0.11"
rand = "0.8"
csv = "1.3"
flate2 = "1.1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
regex = "1"
hex = "0.4"
log = "0.4"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
